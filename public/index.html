header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}

.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--brand)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--soft);color:var(--brand)}
button.primary{background:var(--brand);color:var(--brand-ink);width:100%}

button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.shop:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sub{color:var(--mute);font-size:13px}
.shop{display:flex;gap:12px;cursor:pointer;align-items:flex-start}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;display:grid;place-items:center}
.shop .body{flex:1;min-width:0}.shop b{font-size:16px}
.shop ul,.why{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.score{text-align:right;font-weight:800;color:var(--brand);font-size:20px;line-height:1}.score span{display:block;font-size:11px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tile{background:var(--tile);border-radius:10px;padding:9px 11px;min-width:0}.tile i{display:block;font-style:normal;font-size:12px;color:var(--mute)}.tile b{font-size:15px}
.tile.bad b{color:var(--bad)}
label{font-size:13px;font-weight:700;color:var(--mute);display:block;margin:8px 0 4px}
select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
.brief{margin-top:10px;padding:12px;border-radius:10px;background:var(--soft);font-size:17px;line-height:1.6}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.samples button{font-size:13px;padding:7px 11px;background:var(--tile);color:var(--ink);font-weight:600}

.act input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.done{background:var(--ok-bg);color:var(--ok)}.tag.pending{background:var(--warn-bg);color:var(--warn)}.tag.duplicate{background:var(--tile);color:var(--mute)}.tag.blocked{background:var(--bad-bg);color:var(--bad)}
.res{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.note{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:10px}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

 if(t&&t.status==="awaiting_merchant_confirmation")h+=`<div class="card"><h2>Next-day check</h2><div class="sub">Ticket ${esc(t.id)} shows the replacement as delivered. Sahyogi does not close it yet. It asks the merchant first.</div>${ui[id+"c"]?`<div class="note">${esc(ui[id+"c"])}</div>`:`<div class="row" style="margin-top:10px"><button data-conf="1">Merchant: "Yes, the speaker works"</button><button data-conf="0">Merchant: "Still not working"</button></div>`}</div>`;
 const lc=u.lang;
 h+=`<div class="card"><h2>1. Pre-visit brief</h2><label for="lang">Language</label><select id="lang"><option value="kn"${lc==="kn"?" selected":""}>Kannada</option><option value="hi"${lc==="hi"?" selected":""}>Hindi</option><option value="en"${lc==="en"?" selected":""}>English</option></select>
 <div class="row" style="margin-top:10px"><button class="primary" data-brief style="flex:2" ${u.busy?"disabled":""}>${u.busy==="brief"?"Writing...":"Get brief"}</button><button data-speak ${u.brief?"":"disabled"}>Play aloud</button></div>
 ${u.brief?`<div class="brief ${lc}">${esc(u.brief.text)}</div><div class="sub" style="margin-top:6px">Written by: ${esc(u.brief.src)}${u.speakMsg?" · "+esc(u.speakMsg):""}</div>`:""}</div>`;
 h+=`<div class="card"><h2>2. After the visit</h2><label for="note">Visit note (speak, type or paste; English, Hindi or Kannada)</label><button data-mic style="width:100%;margin-bottom:8px;${rec?'background:var(--bad-bg);color:var(--bad)':''}">${rec?"Stop recording":"Tap to speak"}</button>${u.micMsg?`<div class="sub" style="margin-bottom:6px">${esc(u.micMsg)}</div>`:""}<textarea id="note" placeholder="What did the merchant say?">${esc(u.note||"")}</textarea>
 <div class="samples">${Object.entries({clear:"Sample: replacement + loan",hindi:"Sample: Hindi",unclear:"Sample: unclear note",loan:"Sample: loan only"}).map(([k,v])=>`<button data-sample="${k}">${v}</button>`).join("")}<button data-clearnote style="background:var(--bad-bg);color:var(--bad);border:1.5px solid var(--bad);font-weight:800">✕ Clear text</button></div>
 <button class="primary" data-extract ${u.busy?"disabled":""}>${u.busy==="ex"?"Reading note...":"Turn note into facts"}</button>`;
 if(u.ex){const ex=u.ex.ex;h+=`<div class="note"><b>What I understood</b> <span class="sub">(${esc(u.ex.src)})</span><br>${esc(ex.summary)}</div>`;
  const list=u.acts.map(a=>`<label class="act" style="margin:0;color:var(--ink);font-weight:600"><input type="checkbox" data-key="${esc(a.key)}" ${a.type==="blocked"?"disabled":"checked"}><span>${esc(a.label)}${a.needs_approval?' <span class="sub">(needs your approval)</span>':""}</span></label>`).join("");
  if(ex.needs_clarification)h+=`<div class="note" style="background:var(--bad-bg)"><b>One question:</b> ${esc(ex.question)}<textarea id="clar" rows="2" placeholder="Type the answer (optional)" style="margin:8px 0 0"></textarea><button data-clar style="width:100%;margin-top:6px">Answer and re-read the note</button></div><div class="sub" style="margin-top:10px"><b>Or skip the question and push what I know</b></div>`+list+`<button class="primary" data-approve style="margin-top:10px">Push to CRM anyway</button>`;
  else h+=`<div class="sub" style="margin-top:10px"><b>Approve what I should do</b></div>`+list+`<button class="primary" data-approve style="margin-top:10px">Approve and run</button>`}
 if(u.res)h+=u.res.map(r=>`<div class="res"><span class="tag ${r.state}">${{done:"DONE",pending:"PENDING",duplicate:"DUPLICATE PREVENTED",blocked:"BLOCKED"}[r.state]}</span><span>${esc(r.label)}</span></div>`).join("");
 return h+"</div>"}
function bind(){document.querySelectorAll("[data-open]").forEach(e=>{const go=()=>{view=e.dataset.open;render();scrollTo(0,0)};e.onclick=go;e.onkeydown=ev=>{if(ev.target!==e)return;if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go()}}});
 const b=document.querySelector("[data-back]");if(b)b.onclick=()=>{view="list";render()};
 if(view==="list")return;const id=view,s=S.shops[id],u=ui[id];
 const L=$("lang");if(L)L.onchange=()=>{u.lang=L.value;u.brief=null;render()};
 const N=$("note");if(N)N.oninput=()=>{u.note=N.value};
 const cn=document.querySelector("[data-clearnote]");if(cn)cn.onclick=()=>{u.seq=(u.seq||0)+1;u.note="";u.ex=null;u.res=null;u.micMsg="";render()};
 document.querySelectorAll("[data-sample]").forEach(e=>e.onclick=()=>{u.seq=(u.seq||0)+1;u.note=SAMPLES[e.dataset.sample];u.ex=null;u.res=null;render()});
 const gb=document.querySelector("[data-brief]");if(gb)gb.onclick=async()=>{u.busy="brief";render();u.brief=await makeBrief(s,u.lang);u.busy=null;u.speakMsg="";log("brief",`Brief generated (${u.brief.src}, ${u.lang})`,id);render()};
 const sp=document.querySelector("[data-speak]");if(sp)sp.onclick=()=>speak(u);
 const mc=document.querySelector("[data-mic]");if(mc)mc.onclick=()=>toggleMic(u);
 const ge=document.querySelector("[data-extract]");if(ge)ge.onclick=async()=>{const n=(u.note||"").trim();if(n.length<3)return;u.seq=(u.seq||0)+1;u.busy="ex";u.res=null;render();const r=await extract(n,s);u.busy=null;u.ex=r;u.acts=propose(s,r.ex);log("note","Visit note captured. Clarification needed: "+r.ex.needs_clarification,id);render()};
 const cl=document.querySelector("[data-clar]");if(cl)cl.onclick=async()=>{const a=(($("clar")||{}).value||"").trim();if(a.length<2)return;u.note=(u.note||"")+" The merchant wants: "+a;if(ge)await ge.onclick()};
 const ap=document.querySelector("[data-approve]");if(ap)ap.onclick=async()=>{const keys=[...document.querySelectorAll("[data-key]:checked")].map(e=>e.dataset.key);ap.disabled=true;u.res=[];for(const a of propose(s,u.ex.ex)){if(keys.includes(a.key)||a.type==="blocked")u.res.push(await executeAny(id,a,u.ex.ex))}render()};
 document.querySelectorAll("[data-conf]").forEach(e=>e.onclick=()=>confirmMerchant(id,e.dataset.conf==="1"))}
async function speak(u){const l=u.lang;u.speakMsg="Generating voice...";render();
 try{if(!sarvamOn)throw new Error("offline");const r=await fetch("/api/tts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:u.brief.text,lang:l})});if(!r.ok)throw new Error("HTTP "+r.status);
  const au=new Audio(URL.createObjectURL(await r.blob()));await au.play();u.speakMsg="Sarvam voice";log("tts","Sarvam voice played ("+l+")",view)}
 catch(e){const v="speechSynthesis" in window&&speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(l));
  if(v){const m=new SpeechSynthesisUtterance(u.brief.text);m.lang=VOICE[l];m.voice=v;speechSynthesis.cancel();speechSynthesis.speak(m);u.speakMsg="Device voice (Sarvam unavailable)"}
  else u.speakMsg="Voice unavailable right now. Read the brief on screen."}
 render()}
async function toggleMic(u){if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>recChunks.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(x=>x.stop());const type=(rec.mimeType||"audio/webm").split(";")[0];rec=null;u.micMsg="Transcribing with Sarvam...";render();
   try{const r=await fetch("/api/stt?lang=unknown",{method:"POST",headers:{"content-type":type},body:new Blob(recChunks,{type})});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
    u.seq=(u.seq||0)+1;u.note=((u.note?u.note+" ":"")+(j.text||"")).trim();u.ex=null;u.res=null;u.micMsg=j.text?"Transcribed by Sarvam. Check the text, then continue.":"Heard nothing. Try again or use a sample.";log("stt","Voice note transcribed by Sarvam")}
   catch(e){u.micMsg="Could not transcribe. Type the note or use a sample."}render()};
  rec.start();u.micMsg="Recording... tap again to stop.";render()}
 catch(e){u.micMsg="Microphone blocked. Allow it in the browser, or type the note.";render()}}
function confirmLocal(id,yes){const s=S.shops[id],t=s.open_ticket;if(!t||t.status!=="awaiting_merchant_confirmation")return;
 if(yes){const ev={ticket:t.id,ticket_state:"delivered",merchant_reply:"Yes, the speaker works",closed_on_day:S.day};t.status="closed";s.status="resolved";s.promise_due=null;s.open_ticket=null;log("closed",`Issue closed with evidence: ticket ${t.id} delivered and merchant confirmed`,id);ui[id+"c"]="Closed with evidence: "+JSON.stringify(ev)}
 else{t.status="open";t.opened_days_ago+=1;log("escalated",`Merchant says it still fails. Reopened ${t.id} and escalated to the area manager`,id);ui[id+"c"]="Reopened and escalated to the area manager."}render()}
function nextLocal(){S.day++;let n=0;for(const s of Object.values(S.shops)){const t=s.open_ticket;if(t&&t.status==="replacement_scheduled"){t.status="awaiting_merchant_confirmation";(t.history=t.history||[]).push(`Day ${S.day}: replacement delivered per ticket system`);s.status="awaiting_merchant_confirmation";s.device={model:s.device.model,status:"online",offline_days:0};n++;log("status_check","Ticket shows replacement delivered. Asking the merchant to confirm.",s.id)}}return n}
function retryLocal(){if(S.outage)return"CRM is still down. Nothing to retry.";let n=0;for(const k of [...S.pending]){const r=S.actions[k];delete S.actions[k];S.pending.splice(S.pending.indexOf(k),1);execute(r.shop,r.act,r.ex);n++}return n?`${n} pending update(s) completed.`:"Nothing pending."}
function digestText(){const r=ranked(),open=r.filter(x=>x.open_ticket),risk=r.slice(0,5).filter(x=>!S.visited.includes(x.id)&&x.score>=30).map(x=>x.name),done=Object.values(S.actions).filter(a=>a.state==="done").length,closed=S.audit.filter(a=>a.kind==="closed").length;
 return [`${dateLabel(S.day)} summary`,`Shops visited: ${S.visited.length}`,`Actions completed: ${done}  |  still pending: ${S.pending.length}`,`Issues closed with evidence: ${closed}`,`Open issues: ${open.length} (${open.slice(0,4).map(x=>x.name).join(", ")||"none"})`,`Shops needing a visit soon: ${risk.join(", ")||"none"}`].join("\n")}
function sheet(html){const s=$("sheet");s.innerHTML=`<div class="in">${html}</div>`;s.hidden=false;s.onclick=e=>{if(e.target===s)closeSheet()};s.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>menuAction(b.dataset.x))}
function closeSheet(){$("sheet").hidden=true}
function menu(){sheet(`<b>Demo controls</b>
 <label class="toggle"><input type="checkbox" id="aiT" ${useAI?"checked":""} ${sarvamOn?"":"disabled"}> Use Sarvam for language and notes ${sarvamOn?"":"(offline: server key not set)"}</label>
 <button data-x="next">Next day (simulate)</button><button data-x="outage">${S.outage?"Restore CRM":"Simulate CRM outage"}</button><button data-x="retry">Retry pending updates (${S.pending.length})</button><button data-x="digest">Manager digest</button>${crmOn?`<button data-x="crm">Open mock CRM screen</button>`:""}<button data-x="audit">Audit log</button><button data-x="reset">Reset demo</button><button data-x="close">Close</button>`);
 const t=$("aiT");if(t)t.onchange=()=>{useAI=t.checked;renderHead()}}
async function menuAction(x){if(x==="close")return closeSheet();
 if(x==="crm"){window.open("/crm.html","_blank");return}
 if(x==="next"){const n=await nextDay();closeSheet();render();sheet(`<b>${esc(dateLabel(S.day))}</b><div>${n?`${n} ticket(s) show a delivered replacement. Open the shop and ask the merchant to confirm.`:"No tickets changed."}</div><button data-x="close">OK</button>`)}
 else if(x==="outage"){await setOutage(!S.outage);closeSheet();render()}
 else if(x==="retry"){const m=await retry();closeSheet();render();sheet(`<b>Retry</b><div>${esc(m)}</div><button data-x="close">OK</button>`)}
 else if(x==="digest")sheet(`<b>Manager digest</b><pre>${esc(digestText())}</pre><button data-x="close">Close</button>`);
 else if(x==="audit")sheet(`<b>Audit log</b>${S.audit.slice().reverse().map(a=>`<div class="aud"><time>${esc(a.t)} ${esc(dateFor(a.day))}</time><b>${esc(a.kind)}</b> ${esc(a.msg)}</div>`).join("")||'<div class="sub">Nothing yet.</div>'}<button data-x="close">Close</button>`);
 else if(x==="reset"){await resetAll();closeSheet();render()}}
const tabGo={visits:()=>{view="list";render();scrollTo(0,0)},activity:()=>menuAction("audit"),digest:()=>menuAction("digest"),more:menu};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tabGo[b.dataset.tab]());
// ---- CRM connection (falls back to local state if the CRM service is unreachable)
const crm=(body)=>fetch("/api/crm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
async function refreshFromCRM(){try{const r=await fetch("/api/crm?t="+Date.now());if(!r.ok)throw 0;const j=await r.json();crmOn=true;crmStore=j.store;S.shops=j.shops;S.day=j.day;S.outage=j.outage}catch(e){crmOn=false}renderHead()}
function markPending(id,act,ex){const key=act.key;S.actions[key]={state:"pending",act,shop:id,ex};if(!S.pending.includes(key))S.pending.push(key);log("write_pending","CRM unavailable. Kept pending: "+act.label,id);return{key,state:"pending",label:act.label}}
async function executeCRM(id,act,ex){const key=act.key;
 if(S.actions[key]&&S.actions[key].state==="done"){log("duplicate_blocked","Skipped duplicate: "+act.label,id);return{key,state:"duplicate",label:act.label}}
 if(act.type==="blocked")return{key,state:"blocked",label:act.label};
 try{const r=await crm({op:"action",key,type:act.type,shop:id,label:act.label,summary:ex.summary,promise:act.promise});
  if(r.status===503)return markPending(id,act,ex);if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();S.shops[id]=j.shop;S.day=j.day;
  if(j.state==="duplicate"){log("duplicate_blocked","CRM ignored a duplicate write: "+act.label,id);return{key,state:"duplicate",label:act.label}}
  S.actions[key]={state:"done",act,shop:id};const i=S.pending.indexOf(key);if(i>=0)S.pending.splice(i,1);if(!S.visited.includes(id))S.visited.push(id);log("action_done",act.label,id);return{key,state:"done",label:act.label}}
 catch(e){return markPending(id,act,ex)}}
const executeAny=(id,act,ex)=>crmOn?executeCRM(id,act,ex):Promise.resolve(execute(id,act,ex));
async function retry(){if(!crmOn)return retryLocal();if(!S.pending.length)return"Nothing pending.";let n=0;for(const k of [...S.pending]){const rec=S.actions[k];delete S.actions[k];S.pending.splice(S.pending.indexOf(k),1);const r=await executeCRM(rec.shop,rec.act,rec.ex);if(r.state!=="pending")n++}
 return n?`${n} pending update(s) completed.`:"CRM is still unavailable. Updates stay pending."}
async function nextDay(){if(!crmOn)return nextLocal();try{const r=await crm({op:"nextday"});const j=await r.json();S.shops=j.shops;S.day=j.day;
 for(const s of Object.values(S.shops)){const t=s.open_ticket;if(t&&t.status==="awaiting_merchant_confirmation")log("status_check","Ticket shows replacement delivered. Asking the merchant to confirm.",s.id)}return j.changed}catch(e){return 0}}
async function setOutage(on){if(!crmOn){S.outage=on;log("outage",on?"CRM outage simulated ON":"CRM restored");return}await crm({op:"outage",on});S.outage=on;log("outage",on?"CRM outage simulated ON":"CRM restored")}
async function resetAll(){if(crmOn)await crm({op:"reset"});fresh();await refreshFromCRM()}
async function confirmMerchant(id,yes){if(!crmOn)return confirmLocal(id,yes);const t=S.shops[id].open_ticket;if(!t||t.status!=="awaiting_merchant_confirmation")return;
 try{const r=await crm({op:"confirm",shop:id,positive:yes});if(!r.ok)throw 0;const j=await r.json();S.shops[id]=j.shop;
  if(yes){log("closed",`Issue closed with evidence: ticket ${t.id} delivered and merchant confirmed`,id);ui[id+"c"]="Closed with evidence: "+JSON.stringify(j.evidence)}
  else{log("escalated",`Merchant says it still fails. Reopened ${t.id} and escalated to the area manager`,id);ui[id+"c"]="Reopened and escalated to the area manager."}}
 catch(e){ui[id+"c"]="CRM did not respond. Try again."}render()}
fresh();render();refreshFromCRM().then(render);
(async()=>{try{const r=await fetch("/api/chat");const j=await r.json();sarvamOn=!!j.sarvam;renderHead()}catch(e){}})();
</script></body></html>
