   else{const tk=S.shops[id].open_ticket;(tk.proofs=tk.proofs||[]).push({kind:d.kind,name:d.name,thumb:d.thumb});u.draft=null;u.proofMsg="Proof saved (CRM offline mode)."}
  }catch(e){u.proofMsg="Could not send the photo. It is kept here. Try again."}}
  u.sending=false;render()};
 document.querySelectorAll("[data-skip]").forEach(e=>e.onclick=()=>{u.skip=u.skip||{};u.skip[e.dataset.skip]=!u.skip[e.dataset.skip];render()});
 const cl=document.querySelector("[data-clar]");if(cl)cl.onclick=async()=>{const a=(($("clar")||{}).value||"").trim();if(a.length<2)return;u.note=(u.note||"")+" The merchant wants: "+a;if(ge)await ge.onclick()};
 }
const ttsCache=new Map();let curAu=null;
async function speak(u){const l=u.lang,key=l+"|"+u.brief.text;const cached=ttsCache.get(key);u.speakMsg=cached?"Playing saved voice...":"Generating voice...";render();
 try{if(curAu){curAu.pause();curAu=null}if(window.speechSynthesis)speechSynthesis.cancel();let url=cached;if(!url){if(!sarvamOn)throw new Error("offline");const r=await fetch("/api/tts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:u.brief.text,lang:l})});if(!r.ok)throw new Error("HTTP "+r.status);
  url=URL.createObjectURL(await r.blob());ttsCache.set(key,url)}
  const au=new Audio(url);curAu=au;await au.play();u.speakMsg=cached?"Sarvam voice (replayed, no new call)":"Sarvam voice";log("tts",(cached?"Sarvam voice replayed from saved audio (":"Sarvam voice played (")+l+")",view)}
 catch(e){const v="speechSynthesis" in window&&speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(l));
  if(v){const m=new SpeechSynthesisUtterance(u.brief.text);m.lang=VOICE[l];m.voice=v;speechSynthesis.cancel();speechSynthesis.speak(m);u.speakMsg="Device voice (Sarvam unavailable)"}
  else u.speakMsg="Voice unavailable right now. Read the brief on screen."}
 render()}
async function toggleMic(u){if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>recChunks.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(x=>x.stop());const type=(rec.mimeType||"audio/webm").split(";")[0];rec=null;u.micMsg="Transcribing with Sarvam...";render();
   try{const r=await fetch("/api/stt?lang=unknown",{method:"POST",headers:{"content-type":type},body:new Blob(recChunks,{type})});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
    u.seq=(u.seq||0)+1;u.note=((u.note?u.note+" ":"")+(j.text||"")).trim();u.ex=null;u.res=null;u.micMsg=j.text?"Transcribed by Sarvam"+(j.detected?" (heard "+({"kn-IN":"Kannada","hi-IN":"Hindi","en-IN":"English"}[j.detected]||j.detected)+")":"")+". Check the text, then continue.":"Heard nothing. Try again or use a sample.";log("stt","Voice note transcribed by Sarvam")}
   catch(e){u.micMsg="Could not transcribe. Type the note or use a sample."}render()};
  rec.start();u.micMsg="Recording... tap again to stop.";render()}
 catch(e){u.micMsg="Microphone blocked. Allow it in the browser, or type the note.";render()}}
function nextLocal(){S.day++;let n=0;for(const s of Object.values(S.shops)){const t=s.open_ticket;if(t&&t.status==="replacement_scheduled"&&!t.delivered){t.delivered=true;(t.history=t.history||[]).push(`Day ${S.day}: replacement delivered per ticket system`);s.device={model:s.device.model,status:"online",offline_days:0};n++;log("status_check","Ticket shows replacement delivered. Verify it on the visit.",s.id)}}return n}
function retryLocal(){if(S.outage)return"CRM is still down. Nothing to retry.";let n=0;for(const k of [...S.pending]){const r=S.actions[k];delete S.actions[k];S.pending.splice(S.pending.indexOf(k),1);execute(r.shop,r.act,r.ex);n++}return n?`${n} pending update(s) completed.`:"Nothing pending."}
function digestText(){const r=ranked(),open=r.filter(x=>x.open_ticket),risk=r.slice(0,5).filter(x=>!vToday(x.id)&&x.score>=30).map(x=>x.name),vis=r.filter(x=>vToday(x.id)).map(x=>x.name),done=crmStat?Math.max(crmStat.writes,Object.values(S.actions).filter(a=>a.state==="done").length):Object.values(S.actions).filter(a=>a.state==="done").length,closed=crmStat?crmStat.closed:S.audit.filter(a=>a.kind==="closed").length;
 return [`${dateLabel(S.day)} summary`,`Shops visited: ${vis.length}`,`Actions completed: ${done}  |  still pending: ${S.pending.length}`,`Issues closed with evidence: ${closed}`,`Open issues: ${open.length} (${open.slice(0,4).map(x=>x.name).join(", ")||"none"})`,`Shops needing a visit soon: ${risk.join(", ")||"none"}`].join("\n")}
function digestHTML(){const r=ranked(),open=r.filter(x=>x.open_ticket),risk=r.slice(0,5).filter(x=>!vToday(x.id)&&x.score>=30).map(x=>x.name),vis=r.filter(x=>vToday(x.id)).map(x=>x.name),done=crmStat?Math.max(crmStat.writes,Object.values(S.actions).filter(a=>a.state==="done").length):Object.values(S.actions).filter(a=>a.state==="done").length,closed=crmStat?crmStat.closed:S.audit.filter(a=>a.kind==="closed").length,pend=S.pending.length;
 const T=(n,l)=>`<div class="dt"><b>${n}</b><span>${l}</span></div>`,L=(h,a,c)=>`<div class="dl"><div class="dh">${h}</div>${a.length?a.map(x=>`<div class="dp ${c}">${esc(x)}</div>`).join(""):`<div class="dn">None</div>`}</div>`;
 return `<b style="font-size:17px">Manager digest</b><div class="dm">${esc(dateLabel(S.day))}</div><div class="dg">${T(vis.length,"Shops visited")}${T(done,"Updates sent to CRM")}${T(closed,"Issues closed")}</div>${pend?`<div class="dp w">${pend} update${pend>1?"s":""} waiting for the CRM to come back</div>`:""}${L("Shops visited",vis,"")}${L("Open issues",open.slice(0,4).map(x=>x.name),"w")}${L("Visit soon",risk,"")}<div class="dc">Updates sent to CRM: the notes, tickets and follow-ups the AI wrote into the CRM after the executive approved them.</div><button data-x="close">Close</button>`}
function sheet(html){const s=$("sheet");s.innerHTML=`<div class="in">${html}</div>`;s.hidden=false;s.onclick=e=>{if(e.target===s)closeSheet()};s.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>menuAction(b.dataset.x))}
function closeSheet(){$("sheet").hidden=true}
function menu(){sheet(`<b>Demo controls</b>
 <label class="toggle"><input type="checkbox" id="aiT" ${useAI?"checked":""} ${sarvamOn?"":"disabled"}> Use Sarvam for language and notes ${sarvamOn?"":"(offline: server key not set)"}</label>
 <button data-x="next">Next day (simulate)</button><button data-x="outage">${S.outage?"Restore CRM":"Simulate CRM outage"}</button><button data-x="retry">Retry pending updates (${S.pending.length})</button><button data-x="digest">Manager digest</button>${crmOn?`<button data-x="crm">Open mock CRM screen</button>`:""}<button data-x="audit">Audit log</button><button data-x="reset">Reset demo</button><button data-x="logout">Sign out</button><button data-x="close">Close</button>`);
 const t=$("aiT");if(t)t.onchange=()=>{useAI=t.checked;renderHead()}}
async function menuAction(x){if(x==="close")return closeSheet();if(x==="logout"){closeSheet();return window.sahyogiLogout()}
 if(x==="crm"){window.open("/crm.html","_blank");return}
 if(x==="next"){const n=await nextDay();closeSheet();render();sheet(`<b>${esc(dateLabel(S.day))}</b><div>${n?`${n} ticket(s) show a delivered replacement. Open the shop and ask the merchant to confirm.`:"No tickets changed."}</div><button data-x="close">OK</button>`)}
 else if(x==="outage"){await setOutage(!S.outage);closeSheet();render()}
 else if(x==="retry"){const m=await retry();closeSheet();render();sheet(`<b>Retry</b><div>${esc(m)}</div><button data-x="close">OK</button>`)}
 else if(x==="digest")sheet(digestHTML());
 else if(x==="audit")sheet(`<b>Audit log</b>${S.audit.slice().reverse().map(a=>`<div class="aud"><time>${esc(a.t)} ${esc(dateFor(a.day))}</time><b>${esc(a.kind)}</b> ${esc(a.msg)}</div>`).join("")||'<div class="sub">Nothing yet.</div>'}<button data-x="close">Close</button>`);
 else if(x==="reset"){await resetAll();closeSheet();render()}}
const tabGo={visits:()=>{view="list";render();scrollTo(0,0)},activity:()=>menuAction("audit"),digest:()=>menuAction("digest"),more:menu};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tabGo[b.dataset.tab]());
// ---- CRM connection (falls back to local state if the CRM service is unreachable)
const crm=(body)=>fetch("/api/crm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
let feed=[],seenTs="",crmStat=null;
async function refreshFromCRM(){try{const r=await fetch("/api/crm?t="+Date.now());if(!r.ok)throw 0;const j=await r.json();crmOn=true;feed=(j.events||[]).filter(e=>["approved","denied","ticket_closed","ticket_delivered"].includes(e.kind)||(e.kind==="approval_requested"&&/^Area Manager/.test(e.msg)));crmStore=j.store;crmStat={visited:Object.values(j.shops).filter(s=>typeof s.last_visit==="string"&&s.last_visit.startsWith("Day "+j.day+":")).map(s=>s.id),writes:j.writes||0,closed:(j.closed||[]).length};S.shops=j.shops;S.day=j.day;S.outage=j.outage}catch(e){crmOn=false}renderHead()}
function markPending(id,act,ex){const key=act.key;S.actions[key]={state:"pending",act,shop:id,ex};if(!S.pending.includes(key))S.pending.push(key);log("write_pending","CRM unavailable. Kept pending: "+act.label,id);return{key,state:"pending",label:act.label}}
async function executeCRM(id,act,ex){const key=act.key;
 if(S.actions[key]&&S.actions[key].state==="done"){log("duplicate_blocked","Skipped duplicate: "+act.label,id);return{key,state:"duplicate",label:act.label}}
 if(act.type==="blocked")return{key,state:"blocked",label:act.label};
 try{const r=await crm({op:"action",key,type:act.type,shop:id,label:act.label,summary:ex.summary,note:ex.note||"",promise:act.promise});
  if(r.status===503)return markPending(id,act,ex);if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();S.shops[id]=j.shop;S.day=j.day;
  if(j.state==="duplicate"){log("duplicate_blocked","CRM ignored a duplicate write: "+act.label,id);return{key,state:"duplicate",label:act.label}}
  S.actions[key]={state:"done",act,shop:id};const i=S.pending.indexOf(key);if(i>=0)S.pending.splice(i,1);if(!S.visited.includes(id))S.visited.push(id);(S.visitDay=S.visitDay||{})[id]=S.day;log("action_done",act.label,id);return{key,state:"done",label:act.label}}
 catch(e){return markPending(id,act,ex)}}
const executeAny=(id,act,ex)=>crmOn?executeCRM(id,act,ex):Promise.resolve(execute(id,act,ex));
async function retry(){if(!crmOn)return retryLocal();if(!S.pending.length)return"Nothing pending.";let n=0;for(const k of [...S.pending]){const rec=S.actions[k];delete S.actions[k];S.pending.splice(S.pending.indexOf(k),1);const r=await executeCRM(rec.shop,rec.act,rec.ex);if(r.state!=="pending")n++}
 return n?`${n} pending update(s) completed.`:"CRM is still unavailable. Updates stay pending."}
async function nextDay(){if(!crmOn)return nextLocal();try{const r=await crm({op:"nextday"});const j=await r.json();S.shops=j.shops;S.day=j.day;
 for(const s of Object.values(S.shops)){const t=s.open_ticket;if(t&&t.delivered&&t.status==="replacement_scheduled")log("status_check","Ticket shows replacement delivered. Verify it on the visit.",s.id)}return j.changed}catch(e){return 0}}
async function setOutage(on){if(!crmOn){S.outage=on;log("outage",on?"CRM outage simulated ON":"CRM restored");return}await crm({op:"outage",on});S.outage=on;log("outage",on?"CRM outage simulated ON":"CRM restored")}
async function resetAll(){if(crmOn)await crm({op:"reset"});fresh();await refreshFromCRM()}
fresh();render();refreshFromCRM().then(render);
let lastSig="";setInterval(async()=>{if(!crmOn||document.hidden||rec)return;const ae=document.activeElement;if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))return;await refreshFromCRM();const sig=Object.values(S.shops).map(s=>s.open_ticket?s.open_ticket.id+s.open_ticket.status+(s.open_ticket.proofs||[]).length+(s.open_ticket.denied?"d":""):"-").join("|")+S.day+feed.length+(feed[0]?feed[0].t:"");if(sig!==lastSig){const first=lastSig==="";lastSig=sig;if(!first)render()}},4000);
(async()=>{try{const r=await fetch("/api/chat");const j=await r.json();sarvamOn=!!j.sarvam;renderHead()}catch(e){}})();
